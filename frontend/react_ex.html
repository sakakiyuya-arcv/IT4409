<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý người dùng</title>
    <script src='https://unpkg.com/react@18/umd/react.development.js'></script>
    <script src='https://unpkg.com/react-dom@18/umd/react-dom.development.js'></script>
    <script src='https://unpkg.com/@babel/standalone/babel.min.js'></script>

    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 6px;
            width: 400px;
            max-height: 80vh;
            overflow-y: auto; /* Thêm thanh cuộn nếu form dài */
        }
        .modal-content input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            margin-top: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id='root'></div>

    <script type="text/babel">
        function App() {
            const [kw, setKeyword] = React.useState("");
            const [newUser, setNewUser] = React.useState(null);
            return (
                <div>
                    <h1>Quản lý người dùng</h1>
                    <SearchForm onChangeValue={setKeyword} />
                    <AddUser onAdd={setNewUser} />
                    <ResultTable 
                        keyword={kw} 
                        user={newUser} 
                        onAdded={() => setNewUser(null)} 
                    />
                </div>
            );
        }

        function SearchForm({ onChangeValue }) {
            return (
                <input
                    type="text"
                    placeholder="Tìm theo name, username"
                    onChange={(e) => onChangeValue(e.target.value)}
                    style={{ padding: "8px", width: "300px" }}
                />
            );
        }

        function ResultTable({ keyword, user, onAdded }) {
            const [users, setUsers] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [editing, setEditing] = React.useState(null);

            React.useEffect(() => {
                fetch("https://jsonplaceholder.typicode.com/users")
                    .then(res => res.json())
                    .then(data => { setUsers(data); setLoading(false); });
            }, []);

            React.useEffect(() => {
                if (user) {
                    setUsers((prev) => {
                        const nextId = prev.length > 0 ? Math.max(...prev.map((u) => u.id)) + 1 : 1;
                        return [...prev, { ...user, id: nextId }];
                    });
                    onAdded();
                }
            }, [user]);

            function editUser(user) {
                setEditing({ ...user, address: { ...user.address } });
            }

            // Sửa lại hàm này để bắt được cả address (giống hàm handleChange của AddUser)
            function handleEditChange(id, value) {
                if (["street", "suite", "city"].includes(id)) {
                    setEditing({ ...editing, address: { ...editing.address, [id]: value } });
                } else {
                    setEditing({ ...editing, [id]: value });
                }
            }

            function saveUser() {
                setUsers(prev => prev.map(u => u.id === editing.id ? editing : u));
                setEditing(null);
            }

            function removeUser(id) {
                setUsers((prev) => prev.filter((u) => u.id != id));
            }

            const filteredUsers = users.filter(
                (u) =>
                    u.name.toLowerCase().includes(keyword.toLowerCase()) ||
                    u.username.toLowerCase().includes(keyword.toLowerCase())
            );

            return (
                <div>
                    {/* BỔ SUNG ĐẦY ĐỦ CÁC Ô INPUT CHO FORM SỬA */}
                    {editing && (
                        <div className="modal-overlay">
                            <div className="modal-content">
                                <h4>Sửa người dùng</h4>
                                
                                <label>Họ tên:</label>
                                <input type="text" value={editing.name} onChange={(e) => handleEditChange("name", e.target.value)} />
                                
                                <label>Username:</label>
                                <input type="text" value={editing.username} onChange={(e) => handleEditChange("username", e.target.value)} />
                                
                                <label>Email:</label>
                                <input type="text" value={editing.email} onChange={(e) => handleEditChange("email", e.target.value)} />
                                
                                <label>Số điện thoại:</label>
                                <input type="text" value={editing.phone} onChange={(e) => handleEditChange("phone", e.target.value)} />
                                
                                <label>Đường (Street):</label>
                                <input type="text" value={editing.address.street} onChange={(e) => handleEditChange("street", e.target.value)} />
                                
                                <label>Căn hộ (Suite):</label>
                                <input type="text" value={editing.address.suite} onChange={(e) => handleEditChange("suite", e.target.value)} />
                                
                                <label>Thành phố (City):</label>
                                <input type="text" value={editing.address.city} onChange={(e) => handleEditChange("city", e.target.value)} />

                                <div style={{ marginTop: "10px" }}>
                                    <button onClick={saveUser} style={{ padding: "8px 15px", marginRight: "10px" }}>Lưu</button>
                                    <button onClick={() => setEditing(null)} style={{ padding: "8px 15px" }}>Hủy</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Họ tên</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Địa chỉ</th>
                                <th>Số điện thoại</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            {filteredUsers.map((u) => (
                                <tr key={u.id}>
                                    <td>{u.id}</td>
                                    <td>{u.name}</td>
                                    <td>{u.username}</td>
                                    <td>{u.email}</td>
                                    <td>
                                        {u.address.street}, {u.address.suite}, {u.address.city}
                                    </td>
                                    <td>{u.phone}</td>
                                    <td>
                                        <button onClick={() => editUser(u)} style={{ marginRight: "5px" }}>Sửa</button>
                                        <button onClick={() => removeUser(u.id)}>Xóa</button>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function AddUser({ onAdd }) {
            const [adding, setAdding] = React.useState(false);
            const [user, setUser] = React.useState({
                name: "", username: "", email: "",
                address: { street: "", suite: "", city: "" },
                phone: "", website: ""
            });

            const handleChange = (e) => {
                const { id, value } = e.target;
                if (["street", "suite", "city"].includes(id)) {
                    setUser({ ...user, address: { ...user.address, [id]: value } });
                } else {
                    setUser({ ...user, [id]: value });
                }
            };

            const handleAdd = () => {
                if (user.name === "" || user.username === "") {
                    alert("Vui lòng nhập Name và Username!");
                    return;
                }
                onAdd(user);
                setUser({ name: "", username: "", email: "", address: { street: "", suite: "", city: "" }, phone: "", website: "" });
                setAdding(false);
            };

            return (
                <div style={{ marginTop: "15px" }}>
                    <button onClick={() => setAdding(true)} style={{ padding: "8px 15px" }}>Thêm Người Dùng</button>
                    
                    {/* BỔ SUNG ĐẦY ĐỦ CÁC Ô INPUT CHO FORM THÊM */}
                    {adding && (
                        <div className="modal-overlay">
                            <div className="modal-content">
                                <h4>Thêm người dùng</h4>
                                
                                <label htmlFor="name">Họ tên:</label>
                                <input id="name" type="text" value={user.name} onChange={handleChange}/>
                                
                                <label htmlFor="username">Username:</label>
                                <input id="username" type="text" value={user.username} onChange={handleChange}/>
                                
                                <label htmlFor="email">Email:</label>
                                <input id="email" type="email" value={user.email} onChange={handleChange}/>
                                
                                <label htmlFor="phone">Số điện thoại:</label>
                                <input id="phone" type="text" value={user.phone} onChange={handleChange}/>
                                
                                <label htmlFor="street">Đường (Street):</label>
                                <input id="street" type="text" value={user.address.street} onChange={handleChange}/>
                                
                                <label htmlFor="suite">Căn hộ (Suite):</label>
                                <input id="suite" type="text" value={user.address.suite} onChange={handleChange}/>
                                
                                <label htmlFor="city">Thành phố (City):</label>
                                <input id="city" type="text" value={user.address.city} onChange={handleChange}/>

                                <div style={{ marginTop: "10px" }}>
                                    <button onClick={handleAdd} style={{ padding: "8px 15px", marginRight: "10px" }}>Thêm</button>
                                    <button onClick={() => setAdding(false)} style={{ padding: "8px 15px" }}>Hủy</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web của Nguyễn Hoàng Long</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .author-badge {
            background-color: #e3f2fd;
            color: #1976d2;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }
        h1 {
            color: #2c3e50;
            margin: 0 0 10px 0;
        }
        p {
            color: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="author-badge">Sinh viên: Nguyễn Hoàng Long</div>
        <h1>Chào mừng đến với web của tôi!</h1>
    </div>

</body>
</html>
